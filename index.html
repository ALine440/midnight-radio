<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090612">
  <title>MIDNIGHT RADIO — DIGITAL CASSETTE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" id="bg">
    <div class="bg-image" id="bgImage"></div>
    <div class="bg-tint"></div>
    <div class="bg-grid"></div>
    <div class="bg-vignette"></div>
  </div>

  <section id="enterScreen" class="enter-screen">
    <div class="enter-code">DIGITAL EDITION / 001</div>
    <div class="enter-title">MIDNIGHT<br>RADIO</div>
    <div class="enter-sub">DIGITAL CASSETTE</div>
    <button id="enterBtn" class="enter-btn">ENTER</button>
    <div class="enter-note">CLICK TO INSERT TAPE</div>
  </section>

  <main id="app" class="app" hidden>
    <header class="topbar">
      <div>
        <div class="eyebrow">MIDNIGHT RADIO</div>
        <div class="edition">DIGITAL CASSETTE / 001</div>
      </div>
      <div class="top-actions">
        <button id="muteBtn" class="round-btn" aria-label="Sound">VOL</button>
        <button id="menuBtn" class="round-btn" aria-label="Menu">≡</button>
      </div>
    </header>

    <section class="player-wrap">
      <div class="player-image-wrap">
        <img id="playerImage" class="player-image" src="player.webp" alt="MIDNIGHT RADIO cassette player">


        <!-- Transparent interaction zones over the buttons in player.webp -->
        <button id="prevBtn" class="hotspot hotspot-prev" aria-label="Previous track"></button>
        <button id="playBtn" class="hotspot hotspot-play" aria-label="Play or pause"></button>
        <button id="nextBtn" class="hotspot hotspot-next" aria-label="Next track"></button>
        <button id="playlistBtn" class="hotspot hotspot-playlist" aria-label="Open playlist"></button>
      </div>
    </section>

    <section class="glass-panel track-panel">
      <div class="cover-box" id="coverBox">
        <span id="coverFallback">01</span>
      </div>

      <div class="track-main">
        <div class="track-kicker">
          <span id="trackNo">01 / 12</span>
        </div>
        <h1 id="trackTitle">月光が少しルートを外れる</h1>
        <div class="track-album">MIDNIGHT RADIO</div>

        <button id="currentLyric" class="current-lyric" type="button" aria-label="Open full lyrics">
          <span class="current-lyric-text">LYRICS</span>
        </button>

        <div class="progress-wrap">
          <input id="progress" type="range" min="0" max="1000" value="0" aria-label="Song progress">
          <div class="time-row">
            <span id="currentTime">00:00</span>
            <span id="duration">--:--</span>
          </div>
        </div>
      </div>
    </section>

    <section class="glass-panel tools-panel">
      <div class="volume-row">
        <span class="volume-icon" id="volumeIcon">◖</span>
        <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume">
        <span id="volumeValue">80</span>
      </div>

      <div class="tool-buttons">
        <button id="lyricsBtn" class="glass-btn">LYRICS</button>
        <button id="playlistBtn2" class="glass-btn">PLAYLIST</button>
      </div>
    </section>

    <div class="bottom-note">A DIGITAL CASSETTE FOR LATE NIGHTS</div>
  </main>

  <section id="overlay" class="overlay" hidden>
    <div class="overlay-backdrop" id="overlayBackdrop"></div>
    <div class="overlay-panel">
      <div class="overlay-head">
        <span id="overlayTitle">PLAYLIST</span>
        <button id="closeOverlay" class="close-btn">CLOSE</button>
      </div>

      <div id="playlistView" class="playlist-view"></div>

      <div id="lyricsView" class="lyrics-view" hidden>
        <div id="lyricsScroller" class="lyrics-scroller"></div>
      </div>
    </div>
  </section>

  <audio id="audio" preload="none"></audio>
  <script src="script.js"></script>
</body>
</html>
